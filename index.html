<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Free QR code generator. Create custom QR codes with your logo, colors, and styles. Encode URLs or text, download as PNG. No sign-up required."
    />
    <meta
      name="keywords"
      content="QR code generator, create QR code, custom QR code, QR code with logo, free QR code"
    />
    <meta name="author" content="notkaramel.dev" />
    <meta name="theme-color" content="#8ecae6" />
    <link rel="canonical" href="https://qrcode.notkaramel.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>QR Code Generator, by @notkaramel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doppio+One&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("qrcode-gen-theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qrcode.notkaramel.dev/" />
    <meta
      property="og:title"
      content="QR Code Generator - Create & Download Custom QR Codes"
    />
    <meta
      property="og:description"
      content="Free QR code generator. Create custom QR codes with your logo, colors, and styles. Encode URLs or text, download as PNG. No sign-up required."
    />
    <meta
      property="og:site_name"
      content="QR Code Generator | notkaramel.dev"
    />
    <meta property="og:locale" content="en_US" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="QR Code Generator - Create & Download Custom QR Codes"
    />
    <meta
      name="twitter:description"
      content="Free QR code generator. Create custom QR codes with your logo, colors, and styles. Encode URLs or text, download as PNG. No sign-up required."
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app" x-data="qrcodeApp">
      <header class="header">
        <h1 class="brand-title">make a qr code</h1>
        <button
          type="button"
          class="theme-toggle"
          id="themeToggle"
          :aria-label="themeLabel"
          title="Toggle theme"
          @click="toggleTheme()"
        >
          <span class="icon-sprout" aria-hidden="true"></span>
          <span class="icon-moon-star" aria-hidden="true"></span>
        </button>
      </header>

      <main class="main">
        <div class="controls-column">
          <section class="panel section-content">
            <div class="section-heading-row">
              <h2 class="section-heading">Content</h2>
              <span class="section-rule" aria-hidden="true"></span>
            </div>
            <div class="field">
              <label for="data" class="sr-only">Content</label>
              <textarea
                id="data"
                rows="3"
                placeholder="Enter URL or text…"
                x-model="data"
                @input="onDataInput()"
                @paste="onDataInput()"
              ></textarea>
            </div>
          </section>

          <section class="panel section-style">
            <div class="section-heading-row">
              <h2 class="section-heading">Style options</h2>
              <span class="section-rule" aria-hidden="true"></span>
              <button
                type="button"
                class="randomize-qr"
                id="randomizeQr"
                aria-label="Randomize style"
                title="Randomize style"
                @click="randomizeStyle()"
              >
                <span class="randomize-icon" aria-hidden="true"></span>
                <span>Random style</span>
              </button>
            </div>
            <div class="options-grid">
              <div class="field">
                <label for="dotColor">Dots color</label>
                <input
                  type="color"
                  id="dotColor"
                  x-model="dotColor"
                  @input="render()"
                  @change="render()"
                />
              </div>
              <div class="field">
                <label for="bgColor">Background</label>
                <div
                  class="bg-row"
                  :class="{ 'is-transparent': bgTransparent }"
                >
                  <div class="bg-color-wrap" id="bgColorWrap">
                    <input
                      type="color"
                      id="bgColor"
                      x-model="bgColor"
                      :disabled="bgTransparent"
                      @input="render()"
                      @change="render()"
                    />
                  </div>
                  <button
                    type="button"
                    class="toggle-btn"
                    id="bgTransparent"
                    :class="{
                      'is-active': bgTransparent,
                      'is-expanded': bgTransparent,
                    }"
                    :aria-pressed="bgTransparent"
                    aria-label="Transparent background"
                    title="Transparent"
                    @click="toggleBgTransparent()"
                  >
                    <span class="toggle-icon" aria-hidden="true"></span>
                    <span class="toggle-label">Transparent</span>
                  </button>
                </div>
              </div>
              <div class="field">
                <label for="dotType">Dot style</label>
                <select
                  id="dotType"
                  x-model="dotType"
                  @change="render()"
                >
                  <option value="square">Square</option>
                  <option value="rounded">Rounded</option>
                  <option value="dots">Dots</option>
                  <option value="classy">Classy</option>
                  <option value="classy-rounded">Classy rounded</option>
                  <option value="extra-rounded">Extra rounded</option>
                </select>
              </div>
              <div class="field">
                <label for="cornerType">Corner dot style</label>
                <select
                  id="cornerType"
                  x-model="cornerType"
                  @change="render()"
                >
                  <option value="square">Squares</option>
                  <option value="dot">Dots</option>
                  <option value="extra-rounded">Rounded</option>
                </select>
              </div>
              <div class="field">
                <label for="size">Size (px)</label>
                <input
                  type="number"
                  id="size"
                  min="100"
                  max="2000"
                  x-model.number="size"
                  @input="render()"
                  @change="render()"
                />
              </div>
              <div class="field">
                <label for="margin">Margin</label>
                <input
                  type="number"
                  id="margin"
                  min="0"
                  max="50"
                  x-model.number="margin"
                  @input="render()"
                  @change="render()"
                />
              </div>
              <div class="field field-logo">
                <label>Logo</label>
                <div
                  class="upload-area"
                  id="uploadArea"
                  :class="{ dragover: dragging }"
                  @click="openLogoPicker($event)"
                  @dragover.prevent="dragging = true"
                  @dragleave="dragging = false"
                  @drop.prevent="onDrop($event)"
                >
                  <input
                    type="file"
                    id="logo"
                    x-ref="logoInput"
                    accept="image/*"
                    hidden
                    @change="onLogoChange($event)"
                    @click.stop
                  />
                  <span class="upload-text" id="uploadText" x-text="uploadLabel"></span>
                  <button
                    type="button"
                    class="clear-logo"
                    id="clearLogo"
                    hidden
                    :hidden="!logoDataUrl"
                    @click.stop="clearLogo()"
                  >
                    Remove logo
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section class="panel section-presets">
            <div class="section-heading-row">
              <h2 class="section-heading">Presets</h2>
              <span class="section-rule" aria-hidden="true"></span>
            </div>
            <div class="presets" id="presets">
              <template x-for="(preset, index) in presets" :key="index">
                <div class="preset-slot" :data-slot="index">
                  <input
                    type="text"
                    class="preset-name"
                    :id="'presetName' + index"
                    placeholder="Name…"
                    :aria-label="'Preset ' + (index + 1) + ' name'"
                    x-model="preset.name"
                  />
                  <div class="preset-actions">
                    <button
                      type="button"
                      class="preset-load"
                      :id="'presetLoad' + index"
                      :class="{ 'preset-btn-feedback': preset.feedback === 'Loaded!' }"
                      :disabled="!preset.hasData || !!preset.feedback"
                      @click="loadPreset(index)"
                      x-text="preset.feedback === 'Loaded!' ? 'Loaded!' : 'Load'"
                    ></button>
                    <button
                      type="button"
                      class="preset-save"
                      :id="'presetSave' + index"
                      :class="{ 'preset-btn-feedback': preset.feedback === 'Saved!' }"
                      :disabled="!!preset.feedback"
                      @click="savePreset(index)"
                      x-text="preset.feedback === 'Saved!' ? 'Saved!' : 'Save'"
                    ></button>
                  </div>
                </div>
              </template>
            </div>
          </section>
        </div>

        <section class="panel preview">
          <div class="preview-inner">
            <div
              class="canvas-wrap"
              id="canvasWrap"
              :class="{ 'is-transparent': bgTransparent }"
            >
              <div
                class="spinner"
                id="spinner"
                :hidden="!showingSpinner"
                aria-hidden="true"
              ></div>
              <div id="canvas" x-ref="canvas"></div>
            </div>
            <div class="preview-actions">
              <button
                type="button"
                class="download-qr"
                id="downloadQr"
                @click="download()"
              >
                <span class="download-icon" aria-hidden="true"></span>
                <span>Download QR code</span>
              </button>
            </div>
          </div>
        </section>
      </main>
      <footer class="footer">
        <p>
          Created by
          <a
            href="https://github.com/notkaramel"
            target="_blank"
            rel="noopener noreferrer"
            >@notkaramel</a
          >
          with love and good vibes.
        </p>
        <p>
          Source code available on
          <a
            href="https://github.com/notkaramel/qrcode-generator"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >.
        </p>
      </footer>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
