<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Free QR code generator. Create custom QR codes with your logo, colors, and styles. Encode URLs or text, download as PNG. No sign-up required."
    />
    <meta
      name="keywords"
      content="QR code generator, create QR code, custom QR code, QR code with logo, free QR code"
    />
    <meta name="author" content="notkaramel.dev" />
    <meta name="theme-color" content="#8ecae6" />
    <link rel="canonical" href="https://qrcode.notkaramel.dev/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>QR Code Generator, by @notkaramel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doppio+One&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("qrcode-gen-theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qrcode.notkaramel.dev/" />
    <meta
      property="og:title"
      content="QR Code Generator - Create & Download Custom QR Codes"
    />
    <meta
      property="og:description"
      content="Free QR code generator. Create custom QR codes with your logo, colors, and styles. Encode URLs or text, download as PNG. No sign-up required."
    />
    <meta
      property="og:site_name"
      content="QR Code Generator | notkaramel.dev"
    />
    <meta property="og:locale" content="en_US" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="QR Code Generator - Create & Download Custom QR Codes"
    />
    <meta
      name="twitter:description"
      content="Free QR code generator. Create custom QR codes with your logo, colors, and styles. Encode URLs or text, download as PNG. No sign-up required."
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <header class="header">
        <h1 class="brand-title">make a qr code</h1>
        <button
          type="button"
          class="theme-toggle"
          id="themeToggle"
          aria-label="Toggle dark mode"
          title="Toggle theme"
        >
          <span class="icon-sprout" aria-hidden="true"></span>
          <span class="icon-moon-star" aria-hidden="true"></span>
        </button>
      </header>

      <main class="main">
        <div class="controls-column">
          <section class="panel section-content">
            <div class="section-heading-row">
              <h2 class="section-heading">Content</h2>
              <span class="section-rule" aria-hidden="true"></span>
            </div>
            <div class="field">
              <label for="data" class="sr-only">Content</label>
              <textarea
                id="data"
                rows="3"
                placeholder="Enter URL or text…"
              ></textarea>
            </div>
          </section>

          <section class="panel section-style">
            <div class="section-heading-row">
              <h2 class="section-heading">Style options</h2>
              <span class="section-rule" aria-hidden="true"></span>
              <button
                type="button"
                class="randomize-qr"
                id="randomizeQr"
                aria-label="Randomize style"
                title="Randomize style"
              >
                <span class="randomize-icon" aria-hidden="true"></span>
                <span>Random style</span>
              </button>
            </div>
            <div class="options-grid">
              <div class="field">
                <label for="dotColor">Dots color</label>
                <input type="color" id="dotColor" value="#3d5a6c" />
              </div>
              <div class="field">
                <label for="bgColor">Background</label>
                <div class="bg-row">
                  <div class="bg-color-wrap" id="bgColorWrap">
                    <input type="color" id="bgColor" value="#ffffff" />
                  </div>
                  <button
                    type="button"
                    class="toggle-btn"
                    id="bgTransparent"
                    aria-pressed="false"
                    aria-label="Transparent background"
                    title="Transparent"
                  >
                    <span class="toggle-icon" aria-hidden="true"></span>
                    <span class="toggle-label">Transparent</span>
                  </button>
                </div>
              </div>
              <div class="field">
                <label for="dotType">Dot style</label>
                <select id="dotType">
                  <option value="square">Square</option>
                  <option value="rounded">Rounded</option>
                  <option value="dots">Dots</option>
                  <option value="classy">Classy</option>
                  <option value="classy-rounded">Classy rounded</option>
                  <option value="extra-rounded">Extra rounded</option>
                </select>
              </div>
              <div class="field">
                <label for="cornerType">Corner dot style</label>
                <select id="cornerType">
                  <option value="square">Squares</option>
                  <option value="dot">Dots</option>
                  <option value="extra-rounded">Rounded</option>
                </select>
              </div>
              <div class="field">
                <label for="size">Size (px)</label>
                <input
                  type="number"
                  id="size"
                  min="100"
                  max="2000"
                  value="600"
                />
              </div>
              <div class="field">
                <label for="margin">Margin</label>
                <input
                  type="number"
                  id="margin"
                  min="0"
                  max="50"
                  value="10"
                />
              </div>
              <div class="field field-logo">
                <label>Logo</label>
                <div class="upload-area" id="uploadArea">
                  <input type="file" id="logo" accept="image/*" hidden />
                  <span class="upload-text" id="uploadText"
                    >Drop image or click to upload</span
                  >
                  <button
                    type="button"
                    class="clear-logo"
                    id="clearLogo"
                    hidden
                  >
                    Remove logo
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section class="panel section-presets">
            <div class="section-heading-row">
              <h2 class="section-heading">Presets</h2>
              <span class="section-rule" aria-hidden="true"></span>
            </div>
            <div class="presets" id="presets"></div>
          </section>
        </div>

        <section class="panel preview">
          <div class="preview-inner">
            <div class="canvas-wrap" id="canvasWrap">
              <div class="spinner" id="spinner" hidden aria-hidden="true"></div>
              <div id="canvas"></div>
            </div>
            <div class="preview-actions">
              <button type="button" class="download-qr" id="downloadQr">
                <span class="download-icon" aria-hidden="true"></span>
                <span>Download QR code</span>
              </button>
            </div>
          </div>
        </section>
      </main>
      <footer class="footer">
        <p>
          Created by
          <a
            href="https://github.com/notkaramel"
            target="_blank"
            rel="noopener noreferrer"
            >@notkaramel</a
          >
          with love and good vibes.
        </p>
        <p>
          Source code available on
          <a
            href="https://github.com/notkaramel/qrcode-generator"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >.
        </p>
      </footer>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
